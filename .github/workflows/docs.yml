# Build the documentation (the live site is built by Read the Docs, see .readthedocs.yaml).
# Warnings are treated as errors so that broken docstrings, links or tutorials are caught early.
# The built HTML can be downloaded from the run page ("Artifacts") to preview it.
name: Docs

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install scrich with documentation dependencies
        run: |
          uv venv
          uv pip install -e ".[docs]"

      - name: Build HTML
        run: uv run --no-sync sphinx-build -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
