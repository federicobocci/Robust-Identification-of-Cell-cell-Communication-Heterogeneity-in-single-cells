# Checks run before each commit (after `pre-commit install`) and in CI (.github/workflows/lint.yml).
#   pip install pre-commit && pre-commit install        # once, in the repository
#   pre-commit run --all-files                           # check everything manually
# Notebooks, data and archived code are not checked.
exclude: ^(tutorials|dev|misc)/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
