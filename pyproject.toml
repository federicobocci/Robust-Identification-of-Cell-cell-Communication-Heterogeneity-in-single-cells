[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "scrich"
dynamic = ["version"]
description = "Robust identification of cell-cell communication heterogeneity in single cells (scRICH)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Federico Bocci" }]
requires-python = ">=3.10"
keywords = ["single-cell", "cell-cell communication", "scRNA-seq", "anndata", "scverse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Direct dependencies only, with minimum versions (no exact pins).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "anndata>=0.10",
    "scanpy[leiden]>=1.10",
    "numba>=0.58",
    "matplotlib>=3.7",
    "pooch>=1.8",
    "pyarrow>=14",
]

[project.optional-dependencies]
# RNA velocity-based analyses and plots (scrich.pl.plot_maps, use_velocity=True, ...)
# scvelo 0.3.4 (latest release) breaks with NumPy >= 2.4 in scv.tl.velocity
# ("setting an array element with a sequence"), so cap NumPy when scvelo is installed.
velocity = ["scvelo>=0.3.3", "numpy<2.4", "seaborn>=0.13"]
# Alluvial (Sankey) plots (scrich.pl.alluvial_*); kaleido is needed to save them as pdf/png/svg
alluvial = ["plotly>=5.14", "kaleido"]
# Interactive chord diagrams (scrich.pl.chord_diagram)
chord = ["d3blocks>=1.4"]
# Everything a user needs to run all tutorials
tutorials = ["scrich[velocity,chord,alluvial]", "jupyterlab", "liana"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "pre-commit"]
docs = [
    "sphinx>=7",
    "furo",
    "myst-nb>=1.0",
    "sphinx-copybutton",
    "sphinx-design",
]

[project.urls]
Documentation = "https://scrich.readthedocs.io"
Homepage = "https://github.com/federicobocci/Robust-Identification-of-Cell-cell-Communication-Heterogeneity-in-single-cells"
Source = "https://github.com/federicobocci/Robust-Identification-of-Cell-cell-Communication-Heterogeneity-in-single-cells"
Paper = "https://www.cell.com/cell-systems/fulltext/S2405-4712(26)00185-7"

# Version is taken from git tags (e.g. v1.0.0 -> 1.0.0).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/scrich"]

[tool.hatch.build.targets.sdist]
exclude = ["/tutorials", "/dev", "/misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: tests that need the exFinder database files (downloaded or local)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["dev", "tutorials"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["E501", "E741", "B006", "B008", "B905", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"docs/*" = ["D"]
"scripts/*" = ["D"]
